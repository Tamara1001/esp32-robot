<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <title>ESP32 Robot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="rotateHint">Girá el celular en horizontal</div>

  <div id="layout">
    <!-- Left: joystick (head pan/tilt now; drive joystick later) -->
    <section class="zone zone-left">
      <div id="joystick"><div id="knob"></div></div>
      <p class="readout">Pan <b id="panVal">90</b>° · Tilt <b id="tiltVal">90</b>°</p>
    </section>

    <!-- Center: status, camera placeholder, distance -->
    <section class="zone zone-center">
      <div class="topbar">
        <span id="mockBadge" class="status mock" hidden>MOCK</span>
        <span id="status" class="status off">Desconectado</span>
      </div>
      <div id="camera">Cámara (próximamente)</div>
      <div class="distance-box">
        <span class="distance"><span id="distance">--</span> cm</span>
        <div class="bar"><div id="distanceBar"></div></div>
      </div>
    </section>

    <!-- Right: fine controls -->
    <section class="zone zone-right">
      <label>Pan <input id="panSlider" type="range" min="0" max="180" value="90"></label>
      <label>Tilt <input id="tiltSlider" type="range" min="0" max="180" value="90"></label>
      <label>Stepper <input id="stepperSlider" type="range" min="0" max="359" value="0"></label>
      <p class="readout">Stepper <b id="stepperVal">0</b>° · Pot <b id="potVal">--</b>%</p>
      <button id="centerBtn">Centrar</button>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
